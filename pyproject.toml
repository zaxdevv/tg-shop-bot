[project]
name = "shopbot"
version = "2.0.0"
description = "Telegram shop bot on aiogram 3 and SQLite: catalog, cart, checkout, admin notifications, demo payments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.15,<4"]

[project.scripts]
shopbot = "shopbot.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
